name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'new website/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'new website/package-lock.json'

      - name: Install dependencies
        working-directory: ./new website
        run: npm ci

      - name: Build project
        working-directory: ./new website
        run: npm run build

      - name: Prepare deployment
        run: |
          # Backup CNAME if it exists
          if [ -f "CNAME" ]; then
            cp CNAME CNAME.backup
          fi
          
          # Remove old files (keep new website folder, .git, .github, and CNAME)
          find . -maxdepth 1 \
            ! -name 'new website' \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.gitignore' \
            ! -name 'CNAME' \
            ! -name 'CNAME.backup' \
            ! -name '.' \
            ! -name '..' \
            -exec rm -rf {} + 2>/dev/null || true
          
          # Copy new build files to root
          cp -r "new website/dist/"* .
          
          # Restore CNAME if it was backed up
          if [ -f "CNAME.backup" ]; then
            mv CNAME.backup CNAME
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --staged --quiet || git commit -m "Deploy website from new website folder"
          git push

